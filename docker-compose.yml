version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: matrix_lms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Postgres runs every .sql/.sh file in this directory, in
      # alphabetical order, ONLY the first time the data volume is empty.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - matrix_lms_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: matrix_lms_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Always talk to the Compose service name, regardless of what
      # DB_HOST is set to for local (non-Docker) development in .env.
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      # Serves /frontend as static files via Express (see server.js).
      # Read-only: the container should never write into your source tree.
      - ./frontend:/app/public:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:'+(process.env.PORT||4000)+'/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - matrix_lms_net

volumes:
  db_data:
    driver: local

networks:
  matrix_lms_net:
    driver: bridge
